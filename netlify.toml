[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # Court form template, field map and font are read at runtime by the PDF functions.
  included_files = ["forms/**"]
  external_node_modules = ["pdf-lib", "@pdf-lib/fontkit"]

# Single-page app routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # No analytics, ad or session-replay scripts are allowed (spec Rule 8).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; form-action 'self' https://checkout.stripe.com"
    Cache-Control = "no-store"
